name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flow-test:
    runs-on: ubuntu-latest

    # Not a unit test — it drives the real server against a real Postgres,
    # because the things worth protecting here (row level security, the
    # approval trigger chain) only exist in the database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: am_control
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ['5432:5432']

    env:
      # Superuser on purpose: the app creates a database per agency, and
      # lib/rls.js drops to the unprivileged am_app role for every request.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/am_control
      SESSION_SECRET: ci-secret-not-used-anywhere-real
      FILES_DIR: ./data/files
      BACKUP_DIR: ./data/backups
      PORT: '3111'
      BASE: http://localhost:3111

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Server and suite in ONE step: a process backgrounded in an earlier step
      # can be killed when that step's shell exits.
      - name: Flow test
        run: |
          npm start > /tmp/server.log 2>&1 &
          SERVER=$!
          for i in $(seq 1 60); do
            curl -sf "$BASE/api/health" >/dev/null && break
            if ! kill -0 $SERVER 2>/dev/null; then
              echo "server exited during startup:"; cat /tmp/server.log; exit 1
            fi
            sleep 2
          done
          curl -sf "$BASE/api/health" >/dev/null || {
            echo "server never became healthy:"; cat /tmp/server.log; exit 1; }
          npm test
          STATUS=$?
          kill $SERVER 2>/dev/null || true
          exit $STATUS

      - name: Server log on failure
        if: failure()
        run: cat /tmp/server.log || true
