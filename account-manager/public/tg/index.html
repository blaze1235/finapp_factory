<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Account Manager</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/styles.css">
<style>
  /* Inside Telegram the app should feel like Telegram, not like a website in a
     box — so the palette comes from the client's own theme when it offers one. */
  body { background: var(--tg-theme-bg-color, var(--bg)); color: var(--tg-theme-text-color, var(--ink)); }
  .tg { max-width: 560px; margin: 0 auto; padding: 14px 14px 90px; }
  .tg-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .tg-card {
    background: var(--tg-theme-secondary-bg-color, var(--surface));
    border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; margin-bottom: 9px;
  }
  .tg-card.act { border-color: var(--accent); background: var(--accent-bg); }
  .tg-t { font-weight: 600; }
  .tg-s { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
  .tg-sec { font-size: 11.5px; font-weight: 650; text-transform: uppercase;
    letter-spacing: .06em; color: var(--ink-3); margin: 20px 0 8px; }
  .tg-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .tg-back { background: none; border: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 6px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/kit.js"></script>
<script src="/gantt.js"></script>
<script src="/tg/tg.js"></script>
</body>
</html>
