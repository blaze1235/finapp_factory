<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qoʻshilish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231c1917'/><text y='68' x='50' text-anchor='middle' font-size='54' font-family='system-ui' font-weight='700' fill='%23fbfbfa'>A</text></svg>">
</head>
<body>
<div id="root"></div>
<script src="/kit.js"></script>
<script>
/* Accepting a join link. The invitee sets their own PIN here, which is why the
   agency never has to invent one on their behalf or send it over Telegram. */
const token = location.pathname.split('/').filter(Boolean)[1] || '';
const root = () => document.getElementById('root');

function shell(...kids) {
  clear(root()).append(h('div', { class: 'login' }, h('div', { class: 'box' },
    h('div', { class: 'mark' }, 'A'), ...kids)));
}

function fail(msg) {
  shell(h('h1', 'Havola ishlamadi'), h('p', { class: 'sub' }, msg),
    h('a', { class: 'btn wide', href: '/' }, 'Kirish sahifasiga'));
}

(async function () {
  if (!token) return fail('Havola toʻliq emas.');
  let inv;
  try { inv = await GET(`/api/invite/${token}`); }
  catch (e) { return fail(e.message); }

  const isClient = inv.role === 'client';
  const f = h('form', { onsubmit: submit },
    h('label', { class: 'f' }, h('span', 'Ismingiz'),
      h('input', { class: 'in', name: 'name', value: inv.name || '', required: true, autofocus: true })),
    h('label', { class: 'f' }, h('span', 'Telefon'),
      h('input', { class: 'in', name: 'phone', type: 'tel', value: inv.phone || '', required: true, placeholder: '+998 ...' })),
    h('label', { class: 'f' }, h('span', 'PIN kod ', h('span', { class: 'hint' }, '— 4 raqam, faqat siz bilasiz')),
      h('input', { class: 'in mono', name: 'pin', type: 'password', inputmode: 'numeric', required: true, placeholder: '••••' })),
    h('label', { class: 'f' }, h('span', 'PIN kodni takrorlang'),
      h('input', { class: 'in mono', name: 'pin2', type: 'password', inputmode: 'numeric', required: true, placeholder: '••••' })),
    h('button', { class: 'btn pri wide', type: 'submit', style: { marginTop: '6px' } }, 'Qoʻshilish'));

  shell(
    h('h1', inv.agency),
    h('p', { class: 'sub' }, isClient
      ? 'Loyihalaringizni kuzatish uchun hisob yarating'
      : 'Jamoaga qoʻshilish uchun hisob yarating'),
    f,
    h('div', { class: 'tiny dim', style: { textAlign: 'center', marginTop: '16px' } },
      'PIN kodni faqat siz bilasiz — agentlik uni koʻrmaydi.'));

  async function submit(e) {
    e.preventDefault();
    const btn = f.querySelector('button');
    if (f.pin.value !== f.pin2.value) return toast('PIN kodlar mos kelmadi', 'bad');
    if (!/^\d{4,6}$/.test(f.pin.value)) return toast('PIN 4–6 raqam boʻlishi kerak', 'bad');
    btn.disabled = true;
    try {
      const r = await POST(`/api/invite/${token}/accept`,
        { name: f.name.value, phone: f.phone.value, pin: f.pin.value });
      Store.token = r.token;
      location.href = r.role === 'client' ? '/portal/' : '/';
    } catch (err) { btn.disabled = false; toast(err.message, 'bad'); }
  }
})();
</script>
</body>
</html>
