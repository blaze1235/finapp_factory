providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]

# Install both sub-packages (server + web) explicitly.
[phases.install]
cmds = [
  "npm --prefix server install",
  "npm --prefix web install"
]

# Build the React app, compile the server, generate the Prisma client.
[phases.build]
cmds = ["npm run build"]

# start:prod applies the schema (prisma db push), seeds demo data if the DB is
# empty, then starts the server (which also serves the built web app).
[start]
cmd = "npm start"
